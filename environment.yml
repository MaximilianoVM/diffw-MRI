# Entorno del proyecto. Crear con:  conda env create -f environment.yml
# Activar con:                      conda activate dwmri
name: dwmri
channels:
  - mrtrix3
  - conda-forge
dependencies:
  - python=3.13        # AMICO/COMMIT no compilan con 3.14
  - mrtrix3=3.0.8
  - libstdcxx-ng
  - pip
  - pip:
      - dmri-commit==2.4.2
      - dmri-amico==2.1.1
      - dmri-dicelib==1.3.0
      - numpy==2.5.4
      - scipy==1.18.1
      - nibabel==5.5.0
      - pandas==3.1.1
      - openpyxl==3.1.5
      - scikit-learn==1.9.1
